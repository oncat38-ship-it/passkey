<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パスワード＆サイトマネージャー</title>
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  
  <!-- QR Code Library (QRCode.js) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg-color: #fcf8f6;
      --card-bg: #ffffff;
      --primary: #f28b82;
      --primary-hover: #e57373;
      --text-main: #5f5755;
      --text-sub: #9e9490;
      --border-color: #f0e6e2;
      --shadow: 0 2px 10px rgba(220, 200, 195, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'M PLUS Rounded 1c', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 12px;
    }

    .container {
      width: 100%;
      max-width: 960px; /* 一覧性を高めるため全体の幅を拡大 */
    }

    /* ヘッダー */
    header {
      text-align: center;
      margin-bottom: 12px;
    }

    header h1 {
      font-size: 1.2rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* 認証用カード */
    .auth-card {
      max-width: 400px;
      margin: 20px auto;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }

    /* フォーム要素 */
    .form-group {
      margin-bottom: 10px;
    }

    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-sub);
      margin-bottom: 3px;
    }

    input[type="text"], input[type="password"], input[type="url"] {
      width: 100%;
      padding: 8px 12px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.85rem;
      color: var(--text-main);
      outline: none;
      background-color: #fffaf8;
      transition: all 0.2s;
    }

    input:focus {
      border-color: var(--primary);
      background-color: #fff;
    }

    /* ボタン */
    .btn {
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-google {
      background-color: #fff;
      color: #555;
      border: 1.5px solid var(--border-color);
    }

    /* タブ切り替え */
    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 6px;
      font-size: 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      background: #f7ebe6;
      color: var(--text-sub);
      font-weight: 700;
    }

    .auth-tab.active {
      background: var(--primary);
      color: white;
    }

    /* ユーザーバー & コントロール */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fbf0ec;
      border-radius: 12px;
      padding: 8px 14px;
      margin-bottom: 12px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .user-info {
      font-size: 0.82rem;
    }

    .btn-logout {
      background: none;
      border: none;
      color: var(--primary);
      font-weight: 700;
      cursor: pointer;
      font-size: 0.78rem;
    }

    /* グリッドレイアウト（一画面でたくさん見せるため） */
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px;
    }

    /* 各サイトカード（コンパクト） */
    .item-card {
      background: #fff;
      border-radius: 12px;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 6px rgba(220, 200, 195, 0.12);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .item-title {
      font-weight: 700;
      font-size: 0.92rem;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 170px;
    }

    .item-actions {
      display: flex;
      gap: 4px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      font-size: 0.82rem;
      padding: 3px 5px;
      border-radius: 4px;
    }

    .icon-btn:hover {
      color: var(--primary);
      background-color: #fcf8f6;
    }

    .item-details {
      font-size: 0.78rem;
      display: grid;
      gap: 4px;
    }

    .detail-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fcf8f6;
      padding: 4px 8px;
      border-radius: 6px;
      gap: 4px;
    }

    .detail-val {
      font-family: monospace;
      font-size: 0.8rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex-grow: 1;
      margin: 0 4px;
    }

    .copy-btn {
      border: none;
      background: #f28b8220;
      color: var(--primary);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.72rem;
      cursor: pointer;
      font-weight: 700;
      flex-shrink: 0;
    }

    /* モーダル */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(95, 87, 85, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 100;
      padding: 16px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: white;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .qr-container {
      display: flex;
      justify-content: center;
      margin: 12px 0;
    }

    .qr-container img, .qr-container canvas {
      border-radius: 8px;
      padding: 6px;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1><i class="fa-solid fa-key"></i> PassKey Locker</h1>
  </header>

  <!-- 認証画面 -->
  <div id="auth-section" class="auth-card">
    <div class="auth-tabs">
      <div class="auth-tab active" onclick="switchAuthTab('login')">ログイン</div>
      <div class="auth-tab" onclick="switchAuthTab('register')">新規登録</div>
    </div>

    <form id="auth-form" onsubmit="handleAuth(event)">
      <div class="form-group">
        <label><i class="fa-solid fa-user"></i> ユーザーID</label>
        <input type="text" id="auth-id" placeholder="例: myname" required>
      </div>
      <div class="form-group">
        <label><i class="fa-solid fa-lock"></i> パスワード</label>
        <input type="password" id="auth-pass" placeholder="6文字以上" required>
      </div>
      <button type="submit" id="auth-submit-btn" class="btn btn-primary" style="margin-top: 6px;">
        ログイン
      </button>
    </form>

    <div style="text-align: center; margin: 10px 0 6px; font-size: 0.72rem; color: var(--text-sub);">または</div>

    <button class="btn btn-google" onclick="handleGoogleAuth()">
      <i class="fa-brands fa-google" style="color:#4285F4;"></i> Googleでログイン
    </button>
  </div>

  <!-- メインコンテンツ（ログイン後） -->
  <div id="app-section" class="hidden">
    <!-- コントロールバー -->
    <div class="top-bar">
      <div class="user-info">
        <span><i class="fa-solid fa-circle-user"></i> <strong id="user-display-name">ユーザー</strong> さん</span>
      </div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <button class="btn btn-primary" onclick="openAddModal()" style="padding: 6px 12px; font-size: 0.8rem; width: auto;">
          <i class="fa-solid fa-plus"></i> 新しいサイトを追加
        </button>
        <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> ログアウト</button>
      </div>
    </div>

    <!-- サイト一覧 (グリッド表示) -->
    <div id="items-list" class="items-grid">
      <!-- 動的にカードが挿入されます -->
    </div>
  </div>
</div>

<!-- データ登録・編集モーダル -->
<div id="add-modal" class="modal-overlay">
  <div class="modal">
    <h3 id="modal-title" style="margin-bottom: 12px; color: var(--primary); font-size: 1rem;">新しいサイトを追加</h3>
    <form onsubmit="saveItem(event)">
      <input type="hidden" id="item-doc-id">
      <div class="form-group" style="text-align: left;">
        <label>サービス名 / サイト名</label>
        <input type="text" id="item-title" placeholder="例: X (Twitter)" required>
      </div>
      <div class="form-group" style="text-align: left;">
        <label>URL</label>
        <input type="url" id="item-url" placeholder="https://example.com" required>
      </div>
      <div class="form-group" style="text-align: left;">
        <label>ID / ユーザー名</label>
        <input type="text" id="item-username" placeholder="例: user@example.com" required>
      </div>
      <div class="form-group" style="text-align: left;">
        <label>パスワード</label>
        <input type="text" id="item-password" placeholder="パスワード" required>
      </div>
      <div style="display: flex; gap: 8px; margin-top: 14px;">
        <button type="button" class="btn btn-google" style="margin:0;" onclick="closeAddModal()">キャンセル</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- QRコード確認モーダル -->
<div id="qr-modal" class="modal-overlay">
  <div class="modal">
    <h3 style="color: var(--primary); font-size: 1rem;" id="qr-modal-title">QRコードで移動</h3>
    <p style="font-size: 0.75rem; color: var(--text-sub); margin-top: 2px;">スマホのカメラで読み取って移動できます</p>
    
    <div class="qr-container">
      <div id="qrcode"></div>
    </div>

    <a id="qr-direct-link" href="#" target="_blank" class="btn btn-primary" style="text-decoration: none; margin-bottom: 6px; font-size: 0.82rem;">
      <i class="fa-solid fa-arrow-up-right-from-square"></i> 直接サイトへ飛ぶ
    </a>
    <button class="btn btn-google" style="margin:0; font-size: 0.82rem;" onclick="closeQrModal()">閉じる</button>
  </div>
</div>

<script>
  // Firebase 設定情報
  const firebaseConfig = {
    apiKey: "AIzaSyAoNZm6KwPQuWbC0W65sOh4soLMx1UoUrQ",
    authDomain: "g-account-6f48b.firebaseapp.com",
    projectId: "g-account-6f48b",
    storageBucket: "g-account-6f48b.firebasestorage.app",
    messagingSenderId: "719634797870",
    appId: "1:719634797870:web:5e6c3affbed118aa8d16bf",
    measurementId: "G-0WB2ZMX6K1"
  };

  // 初期化
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let authMode = 'login';
  let qrcodeObj = null;

  // 独自IDを疑似メアドに変換（IDでログイン可能にするため）
  function idToEmail(userUniqueId) {
    return `${userUniqueId.trim().toLowerCase()}@app.internal`;
  }

  // タブ切り替え
  function switchAuthTab(mode) {
    authMode = mode;
    const tabs = document.querySelectorAll('.auth-tab');
    tabs[0].classList.toggle('active', mode === 'login');
    tabs[1].classList.toggle('active', mode === 'register');
    document.getElementById('auth-submit-btn').innerText = mode === 'login' ? 'ログイン' : '新規登録';
  }

  // ログイン / 新規登録 処理
  async function handleAuth(e) {
    e.preventDefault();
    const idVal = document.getElementById('auth-id').value;
    const passVal = document.getElementById('auth-pass').value;
    const email = idToEmail(idVal);

    try {
      if (authMode === 'register') {
        const res = await auth.createUserWithEmailAndPassword(email, passVal);
        await res.user.updateProfile({ displayName: idVal });
      } else {
        await auth.signInWithEmailAndPassword(email, passVal);
      }
    } catch (err) {
      alert('エラー: ' + getFriendlyErrMsg(err.code));
    }
  }

  // Google ログイン
  async function handleGoogleAuth() {
    const provider = new firebase.auth.GoogleAuthProvider();
    try {
      await auth.signInWithPopup(provider);
    } catch (err) {
      alert('Googleログインエラー: ' + err.message);
    }
  }

  // ログアウト
  function logout() {
    auth.signOut();
  }

  // エラーメッセージ変換
  function getFriendlyErrMsg(code) {
    switch (code) {
      case 'auth/user-not-found': return 'ユーザーが見つかりません。';
      case 'auth/wrong-password': return 'パスワードが違います。';
      case 'auth/email-already-in-use': return 'このIDは既に使われています。';
      case 'auth/weak-password': return 'パスワードは6文字以上にしてください。';
      default: return '認証に失敗しました。';
    }
  }

  // 認証状態の監視
  auth.onAuthStateChanged(user => {
    if (user) {
      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('app-section').classList.remove('hidden');
      document.getElementById('user-display-name').innerText = user.displayName || user.email.split('@')[0];
      loadItems(user.uid);
    } else {
      document.getElementById('auth-section').classList.remove('hidden');
      document.getElementById('app-section').classList.add('hidden');
      document.getElementById('items-list').innerHTML = '';
    }
  });

  // データ読み込み（リアルタイム）
  function loadItems(uid) {
    db.collection('users').doc(uid).collection('accounts')
      .orderBy('createdAt', 'desc')
      .onSnapshot(snapshot => {
        const listEl = document.getElementById('items-list');
        listEl.innerHTML = '';

        if (snapshot.empty) {
          listEl.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:30px; color:var(--text-sub); font-size:0.85rem;">登録されているサイトがありません 🌸</div>';
          return;
        }

        snapshot.forEach(doc => {
          const item = doc.data();
          const card = document.createElement('div');
          card.className = 'item-card';
          card.innerHTML = `
            <div class="item-header">
              <span class="item-title" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</span>
              <div class="item-actions">
                <button class="icon-btn" title="QRコード表示" onclick="openQrModal('${escapeHtml(item.url)}', '${escapeHtml(item.title)}')"><i class="fa-solid fa-qrcode"></i></button>
                <button class="icon-btn" title="編集" onclick="editItem('${doc.id}', '${escapeHtml(item.title)}', '${escapeHtml(item.url)}', '${escapeHtml(item.username)}', '${escapeHtml(item.password)}')"><i class="fa-solid fa-pen"></i></button>
                <button class="icon-btn" title="削除" onclick="deleteItem('${doc.id}')"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>
            <div class="item-details">
              <div class="detail-row">
                <span style="color:var(--text-sub); font-size:0.7rem;">ID</span>
                <span class="detail-val" title="${escapeHtml(item.username)}">${escapeHtml(item.username)}</span>
                <button class="copy-btn" onclick="copyText('${escapeHtml(item.username)}')">コピー</button>
              </div>
              <div class="detail-row">
                <span style="color:var(--text-sub); font-size:0.7rem;">PASS</span>
                <span class="detail-val" id="pass-val-${doc.id}">••••••••</span>
                <button class="icon-btn" style="padding:0 2px;" title="表示切替" onclick="togglePass('${doc.id}', '${escapeHtml(item.password)}')">
                  <i class="fa-solid fa-eye" id="pass-icon-${doc.id}"></i>
                </button>
                <button class="copy-btn" onclick="copyText('${escapeHtml(item.password)}')">コピー</button>
              </div>
            </div>
          `;
          listEl.appendChild(card);
        });
      });
  }

  // パスワード表示/非表示の切り替え
  function togglePass(docId, realPassword) {
    const valEl = document.getElementById(`pass-val-${docId}`);
    const iconEl = document.getElementById(`pass-icon-${docId}`);
    
    if (valEl.innerText === '••••••••') {
      valEl.innerText = realPassword;
      iconEl.classList.remove('fa-eye');
      iconEl.classList.add('fa-eye-slash');
    } else {
      valEl.innerText = '••••••••';
      iconEl.classList.remove('fa-eye-slash');
      iconEl.classList.add('fa-eye');
    }
  }

  // データ保存（追加/更新）
  async function saveItem(e) {
    e.preventDefault();
    const user = auth.currentUser;
    if (!user) return;

    const docId = document.getElementById('item-doc-id').value;
    const title = document.getElementById('item-title').value;
    const url = document.getElementById('item-url').value;
    const username = document.getElementById('item-username').value;
    const password = document.getElementById('item-password').value;

    const payload = {
      title, url, username, password,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    try {
      const ref = db.collection('users').doc(user.uid).collection('accounts');
      if (docId) {
        await ref.doc(docId).update(payload);
      } else {
        payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
        await ref.add(payload);
      }
      closeAddModal();
    } catch (err) {
      alert('保存エラー: ' + err.message);
    }
  }

  // 削除
  async function deleteItem(docId) {
    if (!confirm('本当に削除しますか？')) return;
    const user = auth.currentUser;
    if (user) {
      await db.collection('users').doc(user.uid).collection('accounts').doc(docId).delete();
    }
  }

  // クリップボードにコピー
  function copyText(text) {
    navigator.clipboard.writeText(text).then(() => {
      alert('コピーしました！');
    });
  }

  // モーダル操作
  function openAddModal() {
    document.getElementById('modal-title').innerText = '新しいサイトを追加';
    document.getElementById('item-doc-id').value = '';
    document.getElementById('item-title').value = '';
    document.getElementById('item-url').value = '';
    document.getElementById('item-username').value = '';
    document.getElementById('item-password').value = '';
    document.getElementById('add-modal').classList.add('active');
  }

  function editItem(id, title, url, username, password) {
    document.getElementById('modal-title').innerText = 'サイト情報の編集';
    document.getElementById('item-doc-id').value = id;
    document.getElementById('item-title').value = title;
    document.getElementById('item-url').value = url;
    document.getElementById('item-username').value = username;
    document.getElementById('item-password').value = password;
    document.getElementById('add-modal').classList.add('active');
  }

  function closeAddModal() {
    document.getElementById('add-modal').classList.remove('active');
  }

  // QRコード表示モーダル
  function openQrModal(url, title) {
    document.getElementById('qr-modal-title').innerText = title;
    document.getElementById('qr-direct-link').href = url;
    
    const qrContainer = document.getElementById('qrcode');
    qrContainer.innerHTML = '';

    qrcodeObj = new QRCode(qrContainer, {
      text: url,
      width: 150,
      height: 150,
      colorDark : "#5f5755",
      colorLight : "#ffffff",
      correctLevel : QRCode.CorrectLevel.H
    });

    document.getElementById('qr-modal').classList.add('active');
  }

  function closeQrModal() {
    document.getElementById('qr-modal').classList.remove('active');
  }

  // HTMLエスケープ処理（XSS対策）
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>"']/g, function(m) {
      return {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[m];
    });
  }
</script>
</body>
</html>
