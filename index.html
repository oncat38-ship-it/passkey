<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevVault - Keys & Secrets Manager</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @media (max-width: 640px) {
      input, select, textarea {
        font-size: 16px !important;
      }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 right-5 bg-emerald-600 text-white px-4 py-2 rounded-lg shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 flex items-center gap-2 text-xs">
    <i data-lucide="check-circle" class="w-4 h-4"></i>
    <span id="toast-message">クリップボードにコピーしました</span>
  </div>

  <!-- Loading Screen -->
  <div id="loading" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center gap-3">
    <div class="animate-spin rounded-full h-10 w-10 border-2 border-indigo-500 border-t-transparent"></div>
    <span class="text-xs text-slate-400">読み込み中...</span>
  </div>

  <!-- Auth View -->
  <div id="auth-container" class="hidden flex-1 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-xl shadow-2xl w-full max-w-sm">
      <div class="flex items-center gap-3 mb-6">
        <div class="p-2.5 bg-indigo-600/20 text-indigo-400 rounded-lg">
          <i data-lucide="shield-check" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold">DevVault</h1>
          <p class="text-xs text-slate-400">キー・パスワード管理</p>
        </div>
      </div>

      <div class="space-y-4">
        <!-- Google Login Button -->
        <button id="btn-google-login" class="w-full bg-white hover:bg-slate-100 text-slate-800 font-medium py-2.5 px-4 rounded-lg transition text-xs flex items-center justify-center gap-2 shadow">
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          Googleでログイン
        </button>

        <div class="relative flex py-2 items-center">
          <div class="flex-grow border-t border-slate-800"></div>
          <span class="flex-shrink mx-4 text-slate-500 text-[10px] uppercase">またはID / メール</span>
          <div class="flex-grow border-t border-slate-800"></div>
        </div>

        <form id="auth-form" class="space-y-3">
          <div>
            <input type="text" id="auth-email" placeholder="ID または メールアドレス"
              class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm sm:text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <input type="password" id="auth-password" placeholder="パスワード"
              class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm sm:text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
          </div>

          <div id="auth-error" class="text-red-400 text-[11px] hidden"></div>

          <div class="pt-1 flex gap-2">
            <button type="submit" id="btn-login" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-lg transition text-xs">
              ログイン
            </button>
            <button type="button" id="btn-signup" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-2 rounded-lg transition text-xs">
              新規登録
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Main App View -->
  <div id="app-container" class="hidden flex-1 flex flex-col">
    <!-- Header (スッキリしたデザイン) -->
    <header class="bg-slate-900/80 backdrop-blur border-b border-slate-800 sticky top-0 z-40 px-4 sm:px-6 py-2.5 flex justify-between items-center">
      <div class="flex items-center gap-2.5">
        <div class="p-1.5 bg-indigo-600/20 text-indigo-400 rounded-lg">
          <i data-lucide="key-round" class="w-4 h-4"></i>
        </div>
        <span class="font-bold text-sm tracking-wide">DevVault</span>
      </div>
      <div class="flex items-center gap-3">
        <span id="user-display" class="text-[11px] text-slate-300 font-medium bg-slate-950 px-3 py-1 rounded-md border border-slate-800 flex items-center gap-1.5">
          <i data-lucide="user" class="w-3 h-3 text-indigo-400"></i>
          <span id="user-name-text"></span>
        </span>
        <button id="btn-logout" class="text-xs text-slate-400 hover:text-white flex items-center gap-1 bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded-md transition">
          <i data-lucide="log-out" class="w-3 h-3"></i>
          ログアウト
        </button>
      </div>
    </header>

    <!-- Content Area -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-3 sm:p-6 space-y-4">
      
      <!-- Action Bar -->
      <div class="flex flex-col sm:flex-row justify-between gap-3 items-center">
        <div class="flex items-center gap-1.5 text-xs text-slate-400">
          <i data-lucide="shield" class="w-4 h-4 text-indigo-400"></i>
          <span>APIキー・パスワード・接続文字列管理</span>
        </div>

        <div class="flex items-center gap-2 w-full sm:w-auto">
          <div class="relative flex-1 sm:w-48">
            <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-500"></i>
            <input type="text" id="search-input" placeholder="検索..." class="w-full bg-slate-900 border border-slate-800 rounded-lg pl-8 pr-3 py-1.5 text-sm sm:text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
          </div>
          <button id="btn-manage-tags" class="bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-medium transition shrink-0 border border-slate-700" title="タグ管理">
            <i data-lucide="tags" class="w-3.5 h-3.5 text-indigo-400"></i>
            タグ管理
          </button>
          <button id="btn-add-item" class="bg-indigo-600 hover:bg-indigo-500 text-white flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium transition shrink-0">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            追加
          </button>
        </div>
      </div>

      <!-- Tag Filter Bar -->
      <div id="tag-filter-container" class="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs">
        <span class="text-[10px] text-slate-500 uppercase font-semibold shrink-0 mr-1">タグ絞り込み:</span>
        <div id="tag-filters-list" class="flex items-center gap-1.5"></div>
      </div>

      <!-- Item List Section -->
      <section class="space-y-1.5">
        <div id="items-list" class="space-y-1.5"></div>
      </section>

    </main>
  </div>

  <!-- Detail Modal -->
  <div id="detail-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-lg overflow-hidden shadow-2xl flex flex-col max-h-[85vh]">
      <div class="px-4 py-3 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
        <div id="detail-tags-header" class="flex flex-wrap gap-1 min-w-0"></div>
        <button id="btn-close-detail" class="text-slate-400 hover:text-white p-1 shrink-0">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div class="p-4 space-y-3 overflow-y-auto flex-1">
        <div id="detail-memo-container" class="hidden">
          <span class="text-[10px] text-slate-500 uppercase font-semibold">備考欄</span>
          <p id="detail-memo" class="text-xs text-slate-300 mt-0.5 whitespace-pre-wrap"></p>
        </div>
        <div>
          <div class="flex justify-between items-center mb-1">
            <span class="text-[10px] text-slate-500 uppercase font-semibold">値 / キー</span>
            <div class="flex items-center gap-2">
              <button id="detail-btn-toggle-mask" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded flex items-center gap-1 transition">
                <i data-lucide="eye" class="w-3 h-3"></i> 表示/隠す
              </button>
              <button id="detail-btn-copy" class="text-[11px] bg-indigo-600/20 hover:bg-indigo-600/40 text-indigo-300 px-2 py-1 rounded flex items-center gap-1 transition">
                <i data-lucide="copy" class="w-3 h-3"></i> コピー
              </button>
            </div>
          </div>
          <pre id="detail-content-pre" class="bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs font-mono overflow-x-auto text-slate-200 whitespace-pre-wrap select-none blur-sm transition-all duration-200"><code><span id="detail-code-block"></span></code></pre>
        </div>
      </div>
      <div class="px-4 py-2.5 border-t border-slate-800 flex justify-end gap-2 bg-slate-900/50">
        <button id="detail-btn-edit" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-medium transition flex items-center gap-1">
          <i data-lucide="pencil" class="w-3 h-3"></i> 編集
        </button>
        <button id="detail-btn-delete" class="px-3 py-1.5 bg-red-950/40 hover:bg-red-900/50 text-red-400 rounded-lg text-xs font-medium transition flex items-center gap-1">
          <i data-lucide="trash-2" class="w-3 h-3"></i> 削除
        </button>
      </div>
    </div>
  </div>

  <!-- Tag Management Modal -->
  <div id="tag-manage-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-md overflow-hidden shadow-2xl">
      <div class="px-4 py-3 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
        <h3 class="font-bold text-sm text-slate-100 flex items-center gap-1.5">
          <i data-lucide="tags" class="w-4 h-4 text-indigo-400"></i> タグ一覧と編集
        </h3>
        <button id="btn-close-tag-modal" class="text-slate-400 hover:text-white p-1">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div class="p-4 space-y-3 max-h-[70vh] overflow-y-auto">
        <div id="tag-manage-list" class="space-y-2"></div>
      </div>
      <div class="px-4 py-2.5 border-t border-slate-800 flex justify-end bg-slate-900/50">
        <button id="btn-close-tag-modal-bottom" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-medium transition">閉じる</button>
      </div>
    </div>
  </div>

  <!-- Add/Edit Item Modal -->
  <div id="item-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-md overflow-hidden shadow-2xl">
      <div class="px-4 py-3 border-b border-slate-800 flex justify-between items-center">
        <h3 id="modal-title" class="font-bold text-sm text-slate-100">新規キー追加</h3>
        <button id="btn-close-modal" class="text-slate-400 hover:text-white p-1">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <form id="item-form" class="p-4 space-y-3">
        <input type="hidden" id="item-id">
        
        <div>
          <label class="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">タグ (カンマ区切り)</label>
          <input type="text" id="item-tags" required placeholder="例: vercel, secret, api" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-sm sm:text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
          <div id="existing-tags-suggestions" class="flex flex-wrap gap-1 mt-1.5"></div>
        </div>

        <div>
          <label class="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">キー / パスワード / 値</label>
          <textarea id="item-content" required rows="3" placeholder="APIキーや秘密の文字列を貼り付け" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-sm sm:text-xs text-slate-100 font-mono focus:outline-none focus:border-indigo-500"></textarea>
        </div>

        <div>
          <label class="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">備考欄 (任意)</label>
          <input type="text" id="item-memo" placeholder="用途など（例: 本番用Vercelトークン）" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-sm sm:text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
        </div>

        <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
          <button type="button" id="btn-cancel-modal" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-medium transition">キャンセル</button>
          <button type="submit" id="btn-submit-item" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-medium transition">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      signInWithPopup,
      GoogleAuthProvider,
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      updateDoc, 
      deleteDoc, 
      doc, 
      query, 
      where, 
      onSnapshot, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAoNZm6KwPQuWbC0W65sOh4soLMx1UoUrQ",
      authDomain: "g-account-6f48b.firebaseapp.com",
      projectId: "g-account-6f48b",
      storageBucket: "g-account-6f48b.firebasestorage.app",
      messagingSenderId: "719634797870",
      appId: "1:719634797870:web:5e6c3affbed118aa8d16bf",
      measurementId: "G-0WB2ZMX6K1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    let currentUser = null;
    let items = [];
    let searchQuery = '';
    let selectedTags = new Set();
    let activeDetailItem = null;
    let isMasked = true;

    // DOM
    const loading = document.getElementById('loading');
    const authContainer = document.getElementById('auth-container');
    const appContainer = document.getElementById('app-container');
    const authForm = document.getElementById('auth-form');
    const authEmail = document.getElementById('auth-email');
    const authPassword = document.getElementById('auth-password');
    const authError = document.getElementById('auth-error');
    const userNameText = document.getElementById('user-name-text');
    const btnLogout = document.getElementById('btn-logout');
    const btnGoogleLogin = document.getElementById('btn-google-login');

    const itemsList = document.getElementById('items-list');
    const searchInput = document.getElementById('search-input');
    const tagFiltersList = document.getElementById('tag-filters-list');

    const itemModal = document.getElementById('item-modal');
    const modalTitle = document.getElementById('modal-title');
    const itemForm = document.getElementById('item-form');
    const itemIdInput = document.getElementById('item-id');
    const itemTagsInput = document.getElementById('item-tags');
    const itemContentInput = document.getElementById('item-content');
    const itemMemoInput = document.getElementById('item-memo');
    const existingTagsSuggestions = document.getElementById('existing-tags-suggestions');
    const btnSubmitItem = document.getElementById('btn-submit-item');

    const detailModal = document.getElementById('detail-modal');
    const detailTagsHeader = document.getElementById('detail-tags-header');
    const detailMemoContainer = document.getElementById('detail-memo-container');
    const detailMemo = document.getElementById('detail-memo');
    const detailCodeBlock = document.getElementById('detail-code-block');
    const detailBtnCopy = document.getElementById('detail-btn-copy');
    const detailBtnToggleMask = document.getElementById('detail-btn-toggle-mask');
    const detailBtnEdit = document.getElementById('detail-btn-edit');
    const detailBtnDelete = document.getElementById('detail-btn-delete');

    const tagManageModal = document.getElementById('tag-manage-modal');
    const tagManageList = document.getElementById('tag-manage-list');

    function formatAuthInput(val) {
      if (!val.includes('@')) {
        return `${val.trim()}@devvault.local`;
      }
      return val.trim();
    }

    onAuthStateChanged(auth, (user) => {
      loading.classList.add('hidden');
      if (user) {
        currentUser = user;
        userNameText.textContent = user.displayName || user.email.replace('@devvault.local', '');
        authContainer.classList.add('hidden');
        appContainer.classList.remove('hidden');
        subscribeItems();
      } else {
        currentUser = null;
        authContainer.classList.remove('hidden');
        appContainer.classList.add('hidden');
      }
      lucide.createIcons();
    });

    btnGoogleLogin.addEventListener('click', async () => {
      authError.classList.add('hidden');
      try {
        await signInWithPopup(auth, googleProvider);
      } catch (err) {
        authError.textContent = "Googleログインエラー: " + err.message;
        authError.classList.remove('hidden');
      }
    });

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      authError.classList.add('hidden');
      try {
        await signInWithEmailAndPassword(auth, formatAuthInput(authEmail.value), authPassword.value);
      } catch (err) {
        authError.textContent = "ログインエラー: IDまたはパスワードが正しくありません";
        authError.classList.remove('hidden');
      }
    });

    document.getElementById('btn-signup').addEventListener('click', async () => {
      authError.classList.add('hidden');
      if(!authEmail.value || !authPassword.value) {
        authError.textContent = "IDとパスワードを入力してください";
        authError.classList.remove('hidden');
        return;
      }
      try {
        await createUserWithEmailAndPassword(auth, formatAuthInput(authEmail.value), authPassword.value);
      } catch (err) {
        authError.textContent = "登録エラー: " + err.message;
        authError.classList.remove('hidden');
      }
    });

    btnLogout.addEventListener('click', () => signOut(auth));

    function subscribeItems() {
      if (!currentUser) return;
      const loadTimer = setTimeout(() => loading.classList.add('hidden'), 4000);

      onSnapshot(query(collection(db, "items"), where("userId", "==", currentUser.uid)), (snapshot) => {
        clearTimeout(loadTimer);
        loading.classList.add('hidden');
        items = [];
        snapshot.forEach((doc) => {
          const data = doc.data();
          let tags = Array.isArray(data.tags) ? data.tags : (typeof data.tags === 'string' ? data.tags.split(',').map(t => t.trim()).filter(Boolean) : []);
          items.push({ id: doc.id, ...data, tags, content: data.content || '' });
        });
        renderTagFilters();
        renderItems();
      }, (error) => {
        clearTimeout(loadTimer);
        loading.classList.add('hidden');
        console.error("Firestore Error:", error);
      });
    }

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase();
      renderItems();
    });

    function getAllTags() {
      const allTags = new Set();
      items.forEach(item => item.tags?.forEach(t => allTags.add(t)));
      return Array.from(allTags);
    }

    function renderTagFilters() {
      const tags = getAllTags();
      const allSelected = selectedTags.size === 0;

      let html = `<button onclick="toggleTagFilter('ALL')" class="px-2 py-1 rounded text-[11px] font-medium transition ${allSelected ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-slate-400 hover:text-slate-200 border border-slate-800'}">すべて</button>`;
      
      tags.forEach(tag => {
        const isSelected = selectedTags.has(tag);
        html += `<button onclick="toggleTagFilter('${escapeJs(tag)}')" class="px-2 py-1 rounded text-[11px] font-medium transition ${isSelected ? 'bg-indigo-600 text-white shadow' : 'bg-slate-900 text-slate-400 hover:text-slate-200 border border-slate-800'}">#${escapeHtml(tag)}</button>`;
      });

      tagFiltersList.innerHTML = html;
    }

    window.toggleTagFilter = (tag) => {
      if (tag === 'ALL') {
        selectedTags.clear();
      } else {
        selectedTags.has(tag) ? selectedTags.delete(tag) : selectedTags.add(tag);
      }
      renderTagFilters();
      renderItems();
    };

    function renderItems() {
      const filtered = items.filter(item => {
        const matchesSearch = item.content.toLowerCase().includes(searchQuery) || 
                              (item.memo && item.memo.toLowerCase().includes(searchQuery)) ||
                              (item.tags && item.tags.some(t => t.toLowerCase().includes(searchQuery)));
        
        let matchesTags = selectedTags.size === 0 || Array.from(selectedTags).every(t => item.tags?.includes(t));
        return matchesSearch && matchesTags;
      });

      if(filtered.length === 0) {
        itemsList.innerHTML = `<div class="py-12 text-center text-slate-600 text-xs">データがありません</div>`;
        return;
      }

      itemsList.innerHTML = filtered.map(item => {
        const maskedContent = isMasked ? '••••••••••••••••' : item.content;
        return `
          <div onclick="openDetail('${item.id}')" class="bg-slate-900 hover:bg-slate-800/80 border border-slate-800 rounded-lg px-3 py-2.5 flex items-center justify-between cursor-pointer transition group">
            <div class="flex items-center gap-2.5 min-w-0 flex-1 mr-3">
              <div class="flex items-center gap-1 shrink-0">
                ${(item.tags || []).map(t => `<span class="text-[10px] bg-indigo-950/80 text-indigo-300 px-2 py-0.5 rounded border border-indigo-800/50 font-medium">#${escapeHtml(t)}</span>`).join('')}
              </div>
              <span class="text-xs font-mono text-slate-400 truncate ml-1">${escapeHtml(maskedContent)}</span>
              ${item.memo ? `<span class="text-[11px] text-slate-500 truncate hidden md:inline ml-2">(${escapeHtml(item.memo)})</span>` : ''}
            </div>
            <div class="flex items-center gap-1 shrink-0" onclick="event.stopPropagation()">
              <button onclick="toggleMaskGlobal(event)" class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white rounded transition" title="表示/隠す切替">
                <i data-lucide="${isMasked ? 'eye' : 'eye-off'}" class="w-3.5 h-3.5"></i>
              </button>
              <button onclick="copyToClipboard('${escapeJs(item.content)}')" class="p-1.5 bg-slate-800 hover:bg-indigo-600/30 text-slate-400 hover:text-indigo-300 rounded transition" title="コピー">
                <i data-lucide="copy" class="w-3.5 h-3.5"></i>
              </button>
              <button onclick="openDetail('${item.id}')" class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white rounded transition" title="詳細">
                <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    window.toggleMaskGlobal = (e) => {
      e.stopPropagation();
      isMasked = !isMasked;
      renderItems();
    };

    window.openDetail = (id) => {
      const item = items.find(i => i.id === id);
      if(!item) return;
      activeDetailItem = item;
      
      detailTagsHeader.innerHTML = (item.tags || []).map(t => `<span class="text-[11px] bg-indigo-950 border border-indigo-800/60 text-indigo-300 px-2.5 py-0.5 rounded font-medium">#${escapeHtml(t)}</span>`).join('');

      if(item.memo) {
        detailMemo.textContent = item.memo;
        detailMemoContainer.classList.remove('hidden');
      } else {
        detailMemoContainer.classList.add('hidden');
      }

      detailCodeBlock.textContent = item.content || '';
      
      const pre = document.getElementById('detail-content-pre');
      pre.classList.add('select-none', 'blur-sm');
      detailBtnToggleMask.innerHTML = `<i data-lucide="eye" class="w-3 h-3"></i> 表示/隠す`;

      detailModal.classList.remove('hidden');
      lucide.createIcons();
    };

    document.getElementById('btn-close-detail').addEventListener('click', () => detailModal.classList.add('hidden'));

    detailBtnCopy.addEventListener('click', () => {
      if(activeDetailItem) copyToClipboard(activeDetailItem.content);
    });

    detailBtnToggleMask.addEventListener('click', () => {
      const pre = document.getElementById('detail-content-pre');
      if(pre.classList.contains('select-none')) {
        pre.classList.remove('select-none', 'blur-sm');
        detailBtnToggleMask.innerHTML = `<i data-lucide="eye-off" class="w-3 h-3"></i> 隠す`;
      } else {
        pre.classList.add('select-none', 'blur-sm');
        detailBtnToggleMask.innerHTML = `<i data-lucide="eye" class="w-3 h-3"></i> 表示`;
      }
      lucide.createIcons();
    });

    detailBtnEdit.addEventListener('click', () => {
      detailModal.classList.add('hidden');
      editItem(activeDetailItem.id);
    });

    detailBtnDelete.addEventListener('click', async () => {
      if(activeDetailItem && confirm("この項目を削除しますか？")) {
        try {
          await deleteDoc(doc(db, "items", activeDetailItem.id));
          detailModal.classList.add('hidden');
        } catch(err) {
          alert("削除失敗: " + err.message);
        }
      }
    });

    // Tag Management Modal
    document.getElementById('btn-manage-tags').addEventListener('click', () => {
      renderTagManageList();
      tagManageModal.classList.remove('hidden');
    });

    document.getElementById('btn-close-tag-modal').addEventListener('click', () => tagManageModal.classList.add('hidden'));
    document.getElementById('btn-close-tag-modal-bottom').addEventListener('click', () => tagManageModal.classList.add('hidden'));

    function renderTagManageList() {
      const tags = getAllTags();
      if(tags.length === 0) {
        tagManageList.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">登録されているタグはありません</p>`;
        return;
      }
      tagManageList.innerHTML = tags.map(tag => `
        <div class="flex items-center justify-between bg-slate-950 border border-slate-800 rounded-lg p-2.5">
          <span class="text-xs text-indigo-300 font-medium">#${escapeHtml(tag)}</span>
          <div class="flex items-center gap-1.5">
            <button onclick="renameTag('${escapeJs(tag)}')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs rounded transition">名称変更</button>
            <button onclick="deleteTagGlobally('${escapeJs(tag)}')" class="px-2.5 py-1 bg-red-950/40 hover:bg-red-900/50 text-red-400 text-xs rounded transition">削除</button>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    window.renameTag = async (oldTag) => {
      const newTag = prompt(`「${oldTag}」の新しいタグ名:`, oldTag);
      if(!newTag || newTag.trim() === '' || newTag === oldTag) return;
      const clean = newTag.trim();
      try {
        const promises = items.filter(i => i.tags?.includes(oldTag)).map(i => updateDoc(doc(db, "items", i.id), { tags: i.tags.map(t => t === oldTag ? clean : t) }));
        await Promise.all(promises);
        if(selectedTags.has(oldTag)) { selectedTags.delete(oldTag); selectedTags.add(clean); }
        renderTagManageList();
      } catch(err) { alert("変更失敗: " + err.message); }
    };

    window.deleteTagGlobally = async (targetTag) => {
      if(!confirm(`タグ「#${targetTag}」を削除しますか？`)) return;
      try {
        const promises = items.filter(i => i.tags?.includes(targetTag)).map(i => updateDoc(doc(db, "items", i.id), { tags: i.tags.filter(t => t !== targetTag) }));
        await Promise.all(promises);
        selectedTags.delete(targetTag);
        renderTagManageList();
      } catch(err) { alert("削除失敗: " + err.message); }
    };

    // Add/Edit Item Modal
    document.getElementById('btn-add-item').addEventListener('click', () => {
      itemIdInput.value = '';
      itemForm.reset();
      modalTitle.textContent = "新規キー追加";
      renderExistingTagSuggestions();
      itemModal.classList.remove('hidden');
    });

    const closeItemModal = () => itemModal.classList.add('hidden');
    document.getElementById('btn-close-modal').addEventListener('click', closeItemModal);
    document.getElementById('btn-cancel-modal').addEventListener('click', closeItemModal);

    function renderExistingTagSuggestions() {
      const tags = getAllTags();
      existingTagsSuggestions.innerHTML = tags.length === 0 ? '' : 
        `<span class="text-[10px] text-slate-500 w-full block mb-0.5">クリックして追加:</span>` + 
        tags.map(t => `<button type="button" onclick="appendTagToInput('${escapeJs(t)}')" class="text-[10px] bg-slate-950 hover:bg-slate-800 text-indigo-300 border border-slate-800 px-2 py-0.5 rounded transition">#${escapeHtml(t)}</button>`).join('');
    }

    window.appendTagToInput = (tag) => {
      const current = itemTagsInput.value.trim();
      const arr = current ? current.split(',').map(s => s.trim()).filter(Boolean) : [];
      if(!arr.includes(tag)) { arr.push(tag); itemTagsInput.value = arr.join(', '); }
    };

    itemForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if(!currentUser) return;

      const id = itemIdInput.value;
      const tagsArray = itemTagsInput.value.split(',').map(t => t.trim()).filter(Boolean);

      const data = {
        userId: currentUser.uid,
        tags: tagsArray,
        content: itemContentInput.value,
        memo: itemMemoInput.value,
        updatedAt: serverTimestamp()
      };

      btnSubmitItem.disabled = true;
      btnSubmitItem.textContent = "保存中...";

      try {
        if(id) {
          await updateDoc(doc(db, "items", id), data);
        } else {
          await addDoc(collection(db, "items"), data);
        }
        closeItemModal();
      } catch (err) {
        alert("保存失敗: " + err.message);
      } finally {
        btnSubmitItem.disabled = false;
        btnSubmitItem.textContent = "保存";
      }
    });

    window.editItem = (id) => {
      const item = items.find(i => i.id === id);
      if(!item) return;
      itemIdInput.value = item.id;
      itemTagsInput.value = Array.isArray(item.tags) ? item.tags.join(', ') : '';
      itemContentInput.value = item.content || '';
      itemMemoInput.value = item.memo || '';
      modalTitle.textContent = "キーを編集";
      renderExistingTagSuggestions();
      itemModal.classList.remove('hidden');
    };

    window.copyToClipboard = (text) => {
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.remove('opacity-0', 'pointer-events-none');
        setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none'), 1800);
      });
    };

    function escapeHtml(str) {
      if(!str) return '';
      return String(str).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }
    function escapeJs(str) {
      if(!str) return '';
      return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n');
    }
  </script>
</body>
</html>
