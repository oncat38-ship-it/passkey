<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevVault - Keys & Code Manager</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Highlight.js for Code Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 right-5 bg-emerald-600 text-white px-4 py-2 rounded-lg shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 flex items-center gap-2 text-xs">
    <i data-lucide="check-circle" class="w-4 h-4"></i>
    <span id="toast-message">クリップボードにコピーしました</span>
  </div>

  <!-- Loading Screen -->
  <div id="loading" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center">
    <div class="animate-spin rounded-full h-10 w-10 border-2 border-indigo-500 border-t-transparent"></div>
  </div>

  <!-- Auth View -->
  <div id="auth-container" class="hidden flex-1 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-xl shadow-2xl w-full max-w-sm">
      <div class="flex items-center gap-3 mb-6">
        <div class="p-2.5 bg-indigo-600/20 text-indigo-400 rounded-lg">
          <i data-lucide="shield-check" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold">DevVault</h1>
          <p class="text-xs text-slate-400">キー・コード管理</p>
        </div>
      </div>

      <div class="space-y-4">
        <!-- Google Login Button -->
        <button id="btn-google-login" class="w-full bg-white hover:bg-slate-100 text-slate-800 font-medium py-2.5 px-4 rounded-lg transition text-xs flex items-center justify-center gap-2 shadow">
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          Googleでログイン
        </button>

        <div class="relative flex py-2 items-center">
          <div class="flex-grow border-t border-slate-800"></div>
          <span class="flex-shrink mx-4 text-slate-500 text-[10px] uppercase">またはID / メール</span>
          <div class="flex-grow border-t border-slate-800"></div>
        </div>

        <form id="auth-form" class="space-y-3">
          <div>
            <input type="text" id="auth-email" placeholder="ID または メールアドレス"
              class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <input type="password" id="auth-password" placeholder="パスワード"
              class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
          </div>

          <div id="auth-error" class="text-red-400 text-[11px] hidden"></div>

          <div class="pt-1 flex gap-2">
            <button type="submit" id="btn-login" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-lg transition text-xs">
              ログイン
            </button>
            <button type="button" id="btn-signup" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-2 rounded-lg transition text-xs">
              新規登録
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Main App View -->
  <div id="app-container" class="hidden flex-1 flex flex-col">
    <!-- Header -->
    <header class="bg-slate-900/80 backdrop-blur border-b border-slate-800 sticky top-0 z-40 px-4 sm:px-6 py-2.5 flex justify-between items-center">
      <div class="flex items-center gap-2.5">
        <div class="p-1.5 bg-indigo-600/20 text-indigo-400 rounded-lg">
          <i data-lucide="key-round" class="w-4 h-4"></i>
        </div>
        <span class="font-bold text-sm tracking-wide">DevVault</span>
      </div>
      <div class="flex items-center gap-3">
        <span id="user-display" class="text-[11px] text-slate-400 font-mono bg-slate-950 px-2.5 py-1 rounded-md border border-slate-800"></span>
        <button id="btn-logout" class="text-xs text-slate-400 hover:text-white flex items-center gap-1 bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded-md transition">
          <i data-lucide="log-out" class="w-3 h-3"></i>
          ログアウト
        </button>
      </div>
    </header>

    <!-- Content Area -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-3 sm:p-6 space-y-4">
      
      <!-- Top Action Bar -->
      <div class="flex flex-col sm:flex-row justify-between gap-3 items-center">
        <!-- Navigation Tabs -->
        <div class="flex bg-slate-900 p-1 rounded-lg border border-slate-800 w-full sm:w-auto">
          <button id="tab-compact" class="flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-md bg-indigo-600 text-white transition">
            <i data-lucide="shield" class="w-3.5 h-3.5"></i>
            キー・短文
          </button>
          <button id="tab-code" class="flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-md text-slate-400 hover:text-white transition">
            <i data-lucide="code-2" class="w-3.5 h-3.5"></i>
            長文コード・ファイル
          </button>
        </div>

        <!-- Search & Add -->
        <div class="flex items-center gap-2 w-full sm:w-auto">
          <div class="relative flex-1 sm:w-56">
            <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-500"></i>
            <input type="text" id="search-input" placeholder="検索..." class="w-full bg-slate-900 border border-slate-800 rounded-lg pl-8 pr-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
          </div>
          <button id="btn-add-item" class="bg-indigo-600 hover:bg-indigo-500 text-white flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium transition shrink-0">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            追加
          </button>
        </div>
      </div>

      <!-- Compact Section (Slim List) -->
      <section id="section-compact" class="space-y-1.5">
        <div id="compact-list" class="space-y-1.5"></div>
      </section>

      <!-- Code Snippet Section (Slim List) -->
      <section id="section-code" class="hidden space-y-1.5">
        <div id="code-list" class="space-y-1.5"></div>
      </section>

    </main>
  </div>

  <!-- Detail / View Modal -->
  <div id="detail-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-lg overflow-hidden shadow-2xl flex flex-col max-h-[85vh]">
      <div class="px-4 py-3 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
        <div class="flex items-center gap-2">
          <span id="detail-category" class="text-[10px] font-semibold px-2 py-0.5 rounded bg-indigo-950 text-indigo-400 border border-indigo-800/40"></span>
          <h3 id="detail-title" class="font-bold text-sm text-slate-100"></h3>
        </div>
        <button id="btn-close-detail" class="text-slate-400 hover:text-white p-1">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div class="p-4 space-y-3 overflow-y-auto flex-1">
        <div id="detail-memo-container" class="hidden">
          <span class="text-[10px] text-slate-500 uppercase font-semibold">メモ</span>
          <p id="detail-memo" class="text-xs text-slate-300 mt-0.5"></p>
        </div>
        <div>
          <div class="flex justify-between items-center mb-1">
            <span class="text-[10px] text-slate-500 uppercase font-semibold">内容 / 値</span>
            <button id="detail-btn-copy" class="text-[11px] bg-indigo-600/20 hover:bg-indigo-600/40 text-indigo-300 px-2 py-1 rounded flex items-center gap-1 transition">
              <i data-lucide="copy" class="w-3 h-3"></i> コピー
            </button>
          </div>
          <pre id="detail-content-pre" class="bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs font-mono overflow-x-auto text-slate-200 whitespace-pre-wrap max-h-96"><code></code></pre>
        </div>
      </div>
      <div class="px-4 py-2.5 border-t border-slate-800 flex justify-end gap-2 bg-slate-900/50">
        <button id="detail-btn-edit" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-medium transition flex items-center gap-1">
          <i data-lucide="pencil" class="w-3 h-3"></i> 編集
        </button>
        <button id="detail-btn-delete" class="px-3 py-1.5 bg-red-950/40 hover:bg-red-900/50 text-red-400 rounded-lg text-xs font-medium transition flex items-center gap-1">
          <i data-lucide="trash-2" class="w-3 h-3"></i> 削除
        </button>
      </div>
    </div>
  </div>

  <!-- Add/Edit Item Modal -->
  <div id="item-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-md overflow-hidden shadow-2xl">
      <div class="px-4 py-3 border-b border-slate-800 flex justify-between items-center">
        <h3 id="modal-title" class="font-bold text-sm text-slate-100">新規データ追加</h3>
        <button id="btn-close-modal" class="text-slate-400 hover:text-white p-1">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <form id="item-form" class="p-4 space-y-3">
        <input type="hidden" id="item-id">
        
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">データ種別</label>
            <select id="item-type" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
              <option value="compact">キー / パスワード / 短文</option>
              <option value="code">長文コード / ファイル</option>
            </select>
          </div>
          <div>
            <label class="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">カテゴリ / 言語</label>
            <input type="text" id="item-category" placeholder="例: Vercel, API" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
          </div>
        </div>

        <div>
          <label class="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">タイトル / ファイル名</label>
          <input type="text" id="item-title" required placeholder="例: GITHUB_TOKEN" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">内容</label>
          <textarea id="item-content" required rows="5" placeholder="値やコードを貼り付け" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 font-mono focus:outline-none focus:border-indigo-500"></textarea>
        </div>

        <div>
          <label class="block text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-1">メモ (任意)</label>
          <input type="text" id="item-memo" placeholder="補足情報" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
        </div>

        <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
          <button type="button" id="btn-cancel-modal" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-medium transition">キャンセル</button>
          <button type="submit" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-medium transition">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      signInWithPopup,
      GoogleAuthProvider,
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      updateDoc, 
      deleteDoc, 
      doc, 
      query, 
      where, 
      onSnapshot, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAoNZm6KwPQuWbC0W65sOh4soLMx1UoUrQ",
      authDomain: "g-account-6f48b.firebaseapp.com",
      projectId: "g-account-6f48b",
      storageBucket: "g-account-6f48b.firebasestorage.app",
      messagingSenderId: "719634797870",
      appId: "1:719634797870:web:5e6c3affbed118aa8d16bf",
      measurementId: "G-0WB2ZMX6K1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    let currentUser = null;
    let items = [];
    let currentTab = 'compact';
    let searchQuery = '';
    let activeDetailItem = null;

    // DOM
    const loading = document.getElementById('loading');
    const authContainer = document.getElementById('auth-container');
    const appContainer = document.getElementById('app-container');
    const authForm = document.getElementById('auth-form');
    const authEmail = document.getElementById('auth-email');
    const authPassword = document.getElementById('auth-password');
    const authError = document.getElementById('auth-error');
    const userDisplay = document.getElementById('user-display');
    const btnLogout = document.getElementById('btn-logout');
    const btnGoogleLogin = document.getElementById('btn-google-login');

    const tabCompact = document.getElementById('tab-compact');
    const tabCode = document.getElementById('tab-code');
    const sectionCompact = document.getElementById('section-compact');
    const sectionCode = document.getElementById('section-code');
    const compactList = document.getElementById('compact-list');
    const codeList = document.getElementById('code-list');
    const searchInput = document.getElementById('search-input');

    const itemModal = document.getElementById('item-modal');
    const modalTitle = document.getElementById('modal-title');
    const itemForm = document.getElementById('item-form');
    const itemIdInput = document.getElementById('item-id');
    const itemTypeInput = document.getElementById('item-type');
    const itemCategoryInput = document.getElementById('item-category');
    const itemTitleInput = document.getElementById('item-title');
    const itemContentInput = document.getElementById('item-content');
    const itemMemoInput = document.getElementById('item-memo');

    const detailModal = document.getElementById('detail-modal');
    const detailCategory = document.getElementById('detail-category');
    const detailTitle = document.getElementById('detail-title');
    const detailMemoContainer = document.getElementById('detail-memo-container');
    const detailMemo = document.getElementById('detail-memo');
    const detailContentPre = document.getElementById('detail-content-pre').querySelector('code');
    const detailBtnCopy = document.getElementById('detail-btn-copy');
    const detailBtnEdit = document.getElementById('detail-btn-edit');
    const detailBtnDelete = document.getElementById('detail-btn-delete');

    function formatAuthInput(val) {
      if (!val.includes('@')) {
        return `${val.trim()}@devvault.local`;
      }
      return val.trim();
    }

    // 認証監視
    onAuthStateChanged(auth, (user) => {
      loading.classList.add('hidden');
      if (user) {
        currentUser = user;
        userDisplay.textContent = user.email.includes('@devvault.local') ? user.email.replace('@devvault.local', '') : user.email;
        authContainer.classList.add('hidden');
        appContainer.classList.remove('hidden');
        subscribeItems();
      } else {
        currentUser = null;
        authContainer.classList.remove('hidden');
        appContainer.classList.add('hidden');
      }
      lucide.createIcons();
    });

    // Google Login
    btnGoogleLogin.addEventListener('click', async () => {
      authError.classList.add('hidden');
      try {
        await signInWithPopup(auth, googleProvider);
      } catch (err) {
        authError.textContent = "Googleログインエラー: " + err.message;
        authError.classList.remove('hidden');
      }
    });

    // Email/ID Login
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      authError.classList.add('hidden');
      const email = formatAuthInput(authEmail.value);
      try {
        await signInWithEmailAndPassword(auth, email, authPassword.value);
      } catch (err) {
        authError.textContent = "ログインエラー: IDまたはパスワードが正しくありません";
        authError.classList.remove('hidden');
      }
    });

    // Signup
    document.getElementById('btn-signup').addEventListener('click', async () => {
      authError.classList.add('hidden');
      if(!authEmail.value || !authPassword.value) {
        authError.textContent = "IDとパスワードを入力してください";
        authError.classList.remove('hidden');
        return;
      }
      const email = formatAuthInput(authEmail.value);
      try {
        await createUserWithEmailAndPassword(auth, email, authPassword.value);
      } catch (err) {
        authError.textContent = "登録エラー: " + err.message;
        authError.classList.remove('hidden');
      }
    });

    btnLogout.addEventListener('click', () => signOut(auth));

    // Firestore 購読
    function subscribeItems() {
      if (!currentUser) return;
      const q = query(collection(db, "items"), where("userId", "==", currentUser.uid));
      onSnapshot(q, (snapshot) => {
        items = [];
        snapshot.forEach((doc) => {
          items.push({ id: doc.id, ...doc.data() });
        });
        renderItems();
      });
    }

    // タブ切替
    tabCompact.addEventListener('click', () => {
      currentTab = 'compact';
      tabCompact.className = "flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-md bg-indigo-600 text-white transition";
      tabCode.className = "flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-md text-slate-400 hover:text-white transition";
      sectionCompact.classList.remove('hidden');
      sectionCode.classList.add('hidden');
    });

    tabCode.addEventListener('click', () => {
      currentTab = 'code';
      tabCode.className = "flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-md bg-indigo-600 text-white transition";
      tabCompact.className = "flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-md text-slate-400 hover:text-white transition";
      sectionCode.classList.remove('hidden');
      sectionCompact.classList.add('hidden');
    });

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase();
      renderItems();
    });

    function renderItems() {
      const filtered = items.filter(item => {
        return item.title.toLowerCase().includes(searchQuery) || 
               (item.category && item.category.toLowerCase().includes(searchQuery)) ||
               (item.memo && item.memo.toLowerCase().includes(searchQuery));
      });

      // Compact Render (Slim Rows)
      const compactItems = filtered.filter(i => i.type === 'compact' || !i.type);
      if(compactItems.length === 0) {
        compactList.innerHTML = `<div class="py-10 text-center text-slate-600 text-xs">データがありません</div>`;
      } else {
        compactList.innerHTML = compactItems.map(item => `
          <div onclick="openDetail('${item.id}')" class="bg-slate-900 hover:bg-slate-800/80 border border-slate-800 rounded-lg px-3 py-2 flex items-center justify-between cursor-pointer transition group">
            <div class="flex items-center gap-3 min-w-0 flex-1 mr-3">
              <span class="text-[10px] font-semibold px-2 py-0.5 rounded bg-indigo-950/80 text-indigo-400 border border-indigo-800/40 shrink-0">${escapeHtml(item.category || 'General')}</span>
              <span class="font-bold text-xs text-slate-200 truncate shrink-0">${escapeHtml(item.title)}</span>
              <span class="text-xs font-mono text-slate-500 truncate">${escapeHtml(item.content)}</span>
            </div>
            <div class="flex items-center gap-1 shrink-0" onclick="event.stopPropagation()">
              <button onclick="copyToClipboard('${escapeJs(item.content)}')" class="p-1.5 bg-slate-800 hover:bg-indigo-600/30 text-slate-400 hover:text-indigo-300 rounded transition" title="コピー">
                <i data-lucide="copy" class="w-3.5 h-3.5"></i>
              </button>
              <button onclick="openDetail('${item.id}')" class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white rounded transition" title="詳細">
                <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>
        `).join('');
      }

      // Code Items Render (Slim Rows)
      const codeItems = filtered.filter(i => i.type === 'code');
      if(codeItems.length === 0) {
        codeList.innerHTML = `<div class="py-10 text-center text-slate-600 text-xs">長文コードが登録されていません</div>`;
      } else {
        codeList.innerHTML = codeItems.map(item => `
          <div onclick="openDetail('${item.id}')" class="bg-slate-900 hover:bg-slate-800/80 border border-slate-800 rounded-lg px-3 py-2.5 flex items-center justify-between cursor-pointer transition group">
            <div class="flex items-center gap-3 min-w-0 flex-1 mr-3">
              <i data-lucide="file-code" class="w-4 h-4 text-indigo-400 shrink-0"></i>
              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-2">
                  <span class="font-bold text-xs text-slate-200 font-mono truncate">${escapeHtml(item.title)}</span>
                  <span class="text-[10px] text-slate-500 shrink-0">${escapeHtml(item.category || '')}</span>
                </div>
                ${item.memo ? `<p class="text-[11px] text-slate-400 truncate">${escapeHtml(item.memo)}</p>` : ''}
              </div>
            </div>
            <div class="flex items-center gap-1 shrink-0" onclick="event.stopPropagation()">
              <button onclick="copyToClipboard('${escapeJs(item.content)}')" class="p-1.5 bg-slate-800 hover:bg-indigo-600/30 text-slate-400 hover:text-indigo-300 rounded transition" title="コピー">
                <i data-lucide="copy" class="w-3.5 h-3.5"></i>
              </button>
              <button onclick="openDetail('${item.id}')" class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white rounded transition" title="詳細">
                <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>
        `).join('');
      }

      lucide.createIcons();
    }

    // Detail Modal Control
    window.openDetail = (id) => {
      const item = items.find(i => i.id === id);
      if(!item) return;
      activeDetailItem = item;
      detailCategory.textContent = item.category || 'General';
      detailTitle.textContent = item.title;
      
      if(item.memo) {
        detailMemo.textContent = item.memo;
        detailMemoContainer.classList.remove('hidden');
      } else {
        detailMemoContainer.classList.add('hidden');
      }

      detailContentPre.textContent = item.content;
      hljs.highlightElement(detailContentPre);
      detailModal.classList.remove('hidden');
      lucide.createIcons();
    };

    document.getElementById('btn-close-detail').addEventListener('click', () => detailModal.classList.add('hidden'));

    detailBtnCopy.addEventListener('click', () => {
      if(activeDetailItem) copyToClipboard(activeDetailItem.content);
    });

    detailBtnEdit.addEventListener('click', () => {
      detailModal.classList.add('hidden');
      editItem(activeDetailItem.id);
    });

    detailBtnDelete.addEventListener('click', async () => {
      if(activeDetailItem && confirm("この項目を削除しますか？")) {
        await deleteDoc(doc(db, "items", activeDetailItem.id));
        detailModal.classList.add('hidden');
      }
    });

    // Add/Edit Modal
    document.getElementById('btn-add-item').addEventListener('click', () => {
      itemIdInput.value = '';
      itemForm.reset();
      itemTypeInput.value = currentTab;
      modalTitle.textContent = "新規データ追加";
      itemModal.classList.remove('hidden');
    });

    const closeItemModal = () => itemModal.classList.add('hidden');
    document.getElementById('btn-close-modal').addEventListener('click', closeItemModal);
    document.getElementById('btn-cancel-modal').addEventListener('click', closeItemModal);

    itemForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = itemIdInput.value;
      const data = {
        userId: currentUser.uid,
        type: itemTypeInput.value,
        category: itemCategoryInput.value,
        title: itemTitleInput.value,
        content: itemContentInput.value,
        memo: itemMemoInput.value,
        updatedAt: serverTimestamp()
      };

      try {
        if(id) {
          await updateDoc(doc(db, "items", id), data);
        } else {
          await addDoc(collection(db, "items"), data);
        }
        closeItemModal();
      } catch (err) {
        alert("保存失敗: " + err.message);
      }
    });

    window.editItem = (id) => {
      const item = items.find(i => i.id === id);
      if(!item) return;
      itemIdInput.value = item.id;
      itemTypeInput.value = item.type || 'compact';
      itemCategoryInput.value = item.category || '';
      itemTitleInput.value = item.title;
      itemContentInput.value = item.content;
      itemMemoInput.value = item.memo || '';
      modalTitle.textContent = "データを編集";
      itemModal.classList.remove('hidden');
    };

    window.copyToClipboard = (text) => {
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.remove('opacity-0', 'pointer-events-none');
        setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none'), 1800);
      });
    };

    function escapeHtml(str) {
      if(!str) return '';
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }
    function escapeJs(str) {
      if(!str) return '';
      return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n');
    }
  </script>
</body>
</html>
